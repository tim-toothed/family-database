# Правила:
# - отсутствующие поля не писать (напр. если человек не был женат, то не писать поле "spouses")
# - id, birth_name, sex, birth.date, death.date - это обязательные поля. Если информация неизвестна, то писать ??? (напр. если человек умер, но неизвестно когда - "???", а не null или "DD.MM.YYYY")
# - если в дате пропущена только часть, то писать "DD", "MM" или "YYYY" (например, "DD.01.1977" или "07.MM.1955")
# - `people_index.yaml` не является источником информации (не писать в sources)

# Идентификатор личности в базе данных
id: text (например, P001)

# ФИО и другие имена, если применимо
birth_name: text
name_changes:
  - name: text
    date: DD.MM.YYYY
    reason: text (брак, развод, смена имени)

# Гендер
sex: text (м, ж, другой)

# Информация о рождении
birth:
  date: DD.MM.YYYY (обязательное поле)
  date_raw: text (например, "5 марта 1940 года")
  place: text

# Информация о смерти, если применимо
death:
  date: DD.MM.YYYY
  date_raw: text (например, "5 марта 1940 года")
  place: text
  cause: text

# Родители (биологические, приемные, мачеха, отчим и т.д.)
parents:
  - person_id: text (например, P001)
    relation_type: text (мать, отец, мачеха, отчим, приемный отец, приемная мать)
  - person_id: text (например, P001)
    relation_type: text (мать, отец, мачеха, отчим, приемный отец, приемная мать)

# Братья и сестры (биологические, приемные, сводные)
siblings:
  - person_id: text (например, P001)
    relation_type: text (биологический, приемный, сводный по отцу/матери)
  - person_id: text (например, P001)
    relation_type: text (биологический, приемный, сводный по отцу/матери)

# Супруги
spouses:
  - person_id: text (например, P001)
    marriage_date: DD.MM.YYYY
    divorce_date: DD.MM.YYYY (если применимо)

# Дети: от любых браков, биологические, усыновленные, сводные
children:
  - person_id: text (например, P001)
    relation_type: text (биологический, усыновленный, сводный)

# Образование: конкретные места учебы или просто уровень образования
education:
  - education_info: text (место учебы, период учебы, специальность)
  - education_info: text (место учебы, период учебы, специальность)

# Сословие (если применимо)
class_title: text

# Вероисповедание
religion: text 

# Национальность
nationality: text

# Специальности: военный, инженер, врач и т.д. 
profession:
  - title: text
  - title: text

# Конкретные места работы
job_places:
  - job: text (должность, место работы, период работы)
  - job: text (должность, место работы, период работы)

# Военная Служба
military:
  military_service:
    - service_info: text (период службы, звание, место службы)
  war_participation:
    - war: text (название войны, период участия, травмы)
  awards:
    - award: text (название награды, дата получения, причина)

# Места проживания
residences:
  - residence_info: text (место проживания, период проживания)
  - residence_info: text (место проживания, период проживания)

# Хобби, увлечения, интересы
hobbies: text

# Характер и личные качества
character: text

# Внешность
appearance: text

# Болезни и травмы
health: text

# Другие записи: личные воспоминания и информация, которая не подходит ни под одну из вышеперечисленных категорий
other_info: text

# Источник
sources:
  - source: text

# Медиа материалы: фотографии, письма, документы и т.д.
media:
  - description: text (описание материала, например "семейная фотография 1920 года")
    link: text (ссылка на файл или описание местонахождения)