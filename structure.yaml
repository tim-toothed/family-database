# Идентификатор личности в базе данных
id:

# ФИО и другие имена, если применимо
birth_name:
  surname: 
  first_name: 
  patronymic: 

name_changes:
  - name: 
    date: DD.MM.YYYY (или частично, DD.MM.1895, DD.10.YYYY, 10.10.YYYY)
    reason: (брак, развод, смена имени)

# Гендер
sex: (м, ж, другой)

# Информация о рождении
birth:
  date: DD.MM.YYYY (или частично, DD.MM.1895, DD.10.YYYY, 10.10.YYYY)
  date_raw: (например, конец 1920-х годов)
  place: 

# Информация о смерти, если применимо
death:
  date: DD.MM.YYYY (или частично, DD.MM.1895, DD.10.YYYY, 10.10.YYYY)
  date_raw: (например, конец 1920-х годов)
  place: 
  cause: 

# Родители (биологические, приемные, мачеха, отчим и т.д.)
parents:
  - person_id:
    relation_type:  (мать, отец, мачеха, отчим, приемный отец, приемная мать)
  - person_id:  (например, P001)
    relation_type:  (мать, отец, мачеха, отчим, приемный отец, приемная мать)

# Братья и сестры (биологические, приемные, сводные)
siblings:
  - person_id:
    relation_type:  (биологический, приемный, сводный по отцу, сводный по матери)
  - person_id:
    relation_type:  (биологический, приемный, сводный по отцу, сводный по матери)

# Супруги
spouses:
  - person_id:
    marriage_date: DD.MM.YYYY (или частично, DD.MM.1895, DD.10.YYYY, 10.10.YYYY)
    divorce_date: DD.MM.YYYY (или частично, DD.MM.1895, DD.10.YYYY, 10.10.YYYY; если применимо)

# Дети: от любых браков, биологические, приемные, сводные
children:
  - person_id:
    relation_type:  (биологический, приемный, сводный)

# Образование: конкретные места учебы или просто уровень образования
education:
  - education_info:  (Период учебы. Место учебы. Специальность)
  - education_info:  (Период учебы. Место учебы. Специальность)

# Сословие (если применимо)
class_title: 

# Вероисповедание
religion:  

# Национальность
nationality: 

# Специальности: военный, инженер, врач и т.д. 
profession:
  - title: 
  - title: 

# Конкретные места работы
job_places:
  - job:  (должность, место работы, период работы)
  - job:  (должность, место работы, период работы)

# Армия, войны, награды
military:
  military_service:
    - service_info:  (период службы, звание, место службы)
  war_participation:
    - war:  (название войны, период участия, травмы)
  awards:
    - award:  (название награды, дата получения, причина)

# Места проживания
residences:
  - residence_info:  (место проживания, период проживания)
  - residence_info:  (место проживания, период проживания)

# Хобби, увлечения, интересы
hobbies: 

# Характер и личные качества
character: 

# Внешность
appearance: 

# Болезни и травмы
health: 

# Другие записи: личные воспоминания и информация, которая не подходит ни под одну из вышеперечисленных категорий
other_info: 

# Источник
sources:
  - source: 

# Медиа материалы: фотографии, письма, документы и т.д.
media:
  - description:  (описание материала, например "семейная фотография 1920 года")
    link:  (ссылка на файл или описание местонахождения)
