other_info: '"В субботу в 6 часов вечера [...] ее срочно отправили в военный госпиталь, до больницы бы не успели доехать, где я и родилась. Поэтому через два дня нас отправили домой, своим криком я мешала бойцам." (ШСП, стр. 4)


  Знакомство с Раисом Рахимзяновичем - 16 февраля 1972 года, "на комсомольской учебе представители всех вузов города Уфы в пионерлагере в поселке Юматово." (ШСП, стр. 5)


  "С 4 лет до 6,5 меня воспитывали мамины родители"'
