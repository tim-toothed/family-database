- job: 1962-1965. Штамповщица. Школьная практика по понедельникам на заводе "Электроизмеритель"
- job: 1965-1967. Студенческие сельхозработы на первом и втором курсе в колхозах Житомирской области
- job: 1965/1967. Производственная практика; одну четверть работала учительницей 10-го класса школы №7 города Житомира
- job: 1969-1970. Учительница французского языка в средней школе села Великие Коровинцы Житомирской области.
- job: С 1970 года. БГПУ им. М. Акмуллы, преподаватель французского языка
