hobbies: В старшей школе особенно любила математику. [[doc:notes-svetlana-2004-2006|26318|26347]] В юности любила танцы и песни; танцевала твист, немного рок-н-ролл, шейк, танго и вальс, а вальс был связан и с ее отношениями с Раисом.[[doc:notes-svetlana-2004-2006|28810|29318]]
health: Шрам на большом пальце левой руки после глубокого пореза ножом ~1960.
other_info:
- label: Воспоминания о жизни в Лучинах (1957-1962)
  text: Жизнь в Доме офицерского состава, первый человек в космосе, детские игры. [[doc:notes-svetlana-2004-2006|22597|26032]]
- label: Выбор Института
  text: Планировала поступать в Институт иностранных языков в Горьком или затем в Киевский институт иностранных языков, но из-за второй операции матери летом 1965 года взяла на себя хозяйство и уход за ней, поэтому остановилась на факультете иностранных языков при Житомирском пединституте. [[doc:notes-svetlana-2004-2006|27198|27701]]
- label: Аспирантура и работа
  text: После диплома с отличием решила поступать в аспирантуру через год и поехала работать в школу села Великие Коровинцы, но позже выяснилось, что нужно было либо поступать в аспирантуру сразу, либо отработать по направлению не менее двух лет; отказ из аспирантуры и приглашение на работу в Башкирский пединститут пришли в один день, и она поехала работать туда. [[doc:notes-svetlana-2004-2006|36504|37132]]
sources:
