    - war: "Великая Отечественная война (июнь 1941 — март 1943). Западный фронт (Смоленск — Орёл). Из наградного листа от 05.08.1944: участник боёв на Западном фронте. Тяжёлое ранение головы в декабре 1942 под Москвой, лёгкое ранение правой руки 05.03.1942 под Орлом, тяжёлое ранение левой ноги под Смоленском. Лично уничтожил трёх немецких солдат под Орлом."
