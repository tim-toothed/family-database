character: Спокойная, выдержанная; была для Павла верным тылом, опорой и поддержкой, играла главную роль в семье и воспитывала в дочерях уважение к отцу. [[doc:notes-svetlana-2004-2006|14362|14759]] Терпеливо переносила боль и до последних дней заботилась о близких. [[doc:notes-svetlana-2004-2006|14810|15469]]
appearance: 'Красивая, черноволосая. Была чуть выше ростом своего мужа, Павла Леонтьевича.

  В детстве брат, Николай, звал ее толстой [[doc:notes-svetlana-2004-2006|10937|10974]]'
hobbies: Любила песни в исполнении Марка Бернеса, в частности «Журавли». Читала «Жди меня» Константина Симонова наизусть.
other_info:
- label: Речь
  text: В речи часто употребляла присказки и поговорки. [[doc:notes-svetlana-2004-2006|8603|9966]]
- label: Знакомство
  text: В мае 1946 года Нина вновь познакомилась с Павлом Шароваровым, с которым раньше училась в одном классе, после чего между ними завязалась переписка и он сделал ей предложение в письме. [[doc:notes-svetlana-2004-2006|13413|13689]]
- label: Свадьба
  text: Во время отпуска Павла после парада 7 ноября 1946 года они с Ниной зарегистрировали брак в сельсовете в ее обеденный перерыв и скромно отметили свадьбу дома. [[doc:notes-svetlana-2004-2006|13690|14139]]
sources:
