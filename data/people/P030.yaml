hobbies: Любил группу The Beatles. Хорошо рисовал маслом. Увлекался лёгкой атлетикой, позже скалолазанием.
appearance: Невысокий (до 170 см), худощавый, носил удлинённые стрижки.
health: С детства паховая грыжа (из-за неё не прошёл медкомиссию для военно-морского училища). Операцию сделал после сорока лет. Страдал алкоголизмом в 1990-е годы.
other_info:
  other_info1:
    label: Заметка
    text: Хотел поступить в военно-морское училище и стать подводником, но не прошёл медкомиссию. Отец отвёл его в ЛИАП и подал документы. В армии не служил (военная кафедра в ЛИАП, затем сборы). В 1990-е после смерти жены был выселен дочерью из квартиры и жил у матери. Работал в метрополитене, несмотря на проблемы с алкоголем.
sources:
- source: Семейные заметки, стр. 31-33 (записи Евгении Викторовны Шарифуллиной)
