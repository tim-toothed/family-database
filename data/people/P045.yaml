other_info:
  other_info1:
    label: Заметка
    text: В конце жизни за ней присматривала женщина по имени Люба. Во время русских погромов в Баку в 1990-е годы её защищала соседка-азербайджанка. Жила в квартире, полученной от ткацкой фабрики. После её смерти родственникам долго не сообщали, так как опасались спора из-за квартиры.
sources:
- source: Семейные заметки, стр. 36-37 (записи Евгении Викторовны Шарифуллиной)
