other_info:
  other_info1:
    label: Заметка
    text: Работала ткачихой как в Саратовской области, так и после переезда семьи в Баку. Район проживания в Баку в разные периоды назывался Заводской, Фабричный, Шаумяновский, позже Хатаинский. Промышленная зона города с нефтеперерабатывающими заводами и портовой инфраструктурой.
