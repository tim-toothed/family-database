other_info:
- label: Заметка
  text: "Родная мать умерла рано, после было 2 мачехи. Круглой сиротой стала в 8 лет 1932 год. Отец поехал на обучение по партийной линии в Подмосковье и там был убит бандитами. До этого прислал домой письмо с со своим фото в гробу (были в то время такие шутки) . \nПозже во время голода в Поволжье (1932-33гг.), мачеха с Фанузой переехала в Ташкент к своим родным, а Фахирю с братом оставила у дальних родственников бывшего мужа на мельнице. Фахиря стала там работницей. Обращались с ней не очень, но она до конца жизни помогала хозяйке Зайтуне-апе (тётя Зина)."
