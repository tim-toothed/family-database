character: По воспоминаниям, она хорошо училась. По рассказам Ольги Леонидовны, своего отца не уважала и относилась к нему презрительно (так же как и её мать).
appearance: В детстве описывается как очень красивая девочка; её красиво одевали.
health: В детстве росла здоровой, не болела. В детстве её закаляли
other_info:
- label: Заметка
  text: 'После смерти матери Натальи в 1990-е годы, по рассказу родственников, выставила отца из квартиры, сменив замки. В 90-х мать Наталья умерла. После этого Анна собрала вещи отца в чемодан и поменяла замки во входной двери, выставила Виктора из дома, сказав: «Ты здесь не прописан».'
sources:
- source: Семейные заметки, стр. 7-9 (записи Евгении Викторовны Шарифуллиной)
