- label: Смена имени
  text: Её настоящее имя при рождении Оксана (по-украински). В царской России имя перевели на русский как Ксения. [[doc:notes-svetlana-2004-2006|299669|299699]]
- label: Внучка Светлана Павловна
  text: Летом солила арбузы для своей внучки, Шароваровой Светланы Павловны - свежие она не ела. [[doc:notes-svetlana-2004-2006|6989|7063]]
- label: 4 неуказанных детей
  text: У Оксаны было ещё четверо детей, но все они умирали маленькими. Никакой информации о них нет
- label: Речь
  text: В речи часто употребляла присказки и поговорки. [[doc:notes-svetlana-2004-2006|8603|9966]]
