appearance: "Невысокий, до 170 см, крепко сбитый, блондин с голубыми глазами. Седой в старости, с пузцом, но плотный. Красные руки (кисти) — отморозил во время пешей эвакуации по Ладожскому озеру."

health: "Ишемическая болезнь сердца (от неё и умер). Много пил с 1970-х годов, предположительно после паралича матери."

other_info: "Двоюродные сестры (по брату отца): Валентина Ивановна Богданова [P022], Богданова Зинаида Ивановна [P021] (неточно)."

sources:
