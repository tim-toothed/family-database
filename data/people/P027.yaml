  - education_info: "Каспийское высшее военно-морское Краснознамённое училище им. С. М. Кирова (выпуск февраль–март 1945). Курсанты были эвакуированы в Баку в 1942 году."
  - education_info: "СКОС (курсы для офицерского состава)"

class_title: "Военный; Военный в отставке; Член ВЛКСМ. Партийность неизвестна."

profession:
  - title: "военный"
  - title: "преподаватель"

job_places:
  - job: "Служил на сторожевых кораблях ВМФ ТОФ (Тихоокеанский флот), БЧ-1 — штурманская боевая часть (командир). Места службы: Баку, Владивосток, Порт-Артур, Корсаков (Сахалин)."
  - job: "Во второй половине 1950-х преподавал в КВВМРУ(?) в Баку."
  - job: "Совместно с двумя коллегами создал учебник «Плавание при особых обстоятельствах» (1958)."
  - job: "Работал в Ленинграде в ВМАКВ им. А. Н. Крылова (Военно-морская академия кораблестроения и вооружения)."
  - job: "Преподавал в ВМАКВ им. Н. Г. Кузнецова."
  - job: "Позднее работал в военной части на Васильевском острове."

military:
  military_service:
    - service_info: "19.09.1940 — начало службы (ВРККА, присяга в училище(?))."
    - service_info: "1945 — присвоено звание лейтенант (ещё во время учёбы)."
    - service_info: "1949 — старший лейтенант."
    - service_info: "1953 — капитан 3-го ранга."
    - service_info: "Позднее — капитан 2-го ранга."
    - service_info: "01.12.1961 — завершил службу (в период военной реформы Хрущёва, 1953–1964)."
  war_participation:
    - war: "Участвовал курсантом в боях за Ленинград до эвакуации 1942 года в ВМУ в Баку."
    - war: "В 1945 или в 1944 году участвовал в перегоне кораблей, переданных по ленд-лизу США для СССР, из Cold Bay(?) во Владивосток. Лейтенант, командир БЧ-1-4 фрегата ЭК-12, 11-й дивизион ЭК, 5-й отдельный отряд кораблей ВМФ ТОФ (12 1 БСКР ТОФ)."
  awards:
    - award: "Медаль «За оборону Ленинграда», вручена 26.12.1943."
    - award: "Орден Красной Звезды — представлен к награде за перегон кораблей по ленд-лизу."
    - award: "Медаль «За победу над Японией», 20.04.1946, Порт-Артур."
    - award: "Медаль «За победу над Германией», 08.08.1946, Порт-Артур."
    - award: "Медаль «За боевые заслуги», 1949, Сахалин."
    - award: "Орден Красной Звезды, 21.08.1953, капитан третьего ранга."

