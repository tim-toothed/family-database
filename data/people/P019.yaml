other_info: Происходил из крестьянской семьи. Переехал с семьей в Ленинград в 1920-х годах, чтобы у детей было образование; переезд датируется примерно промежутком с 1924 по 1926-1927 годы. Оба сына родились в Сергеевском, а старший сын Леонид пошел в школу уже в Ленинграде. Открытка с его фотографией, подписанная невесте, содержит орфографические ошибки. По семейным сведениям, жил до 1962-1963 года; на могиле утрачена табличка с годами, в семье документы не сохранились. В 1962 году был организован участок на Богословском кладбище, при этом существует фотография Алексея Владимировича от 1963 года.
sources:
- source: Семейные заметки, стр. 7-9, 21-25 (записи Евгении Викторовны Шарифуллиной)
