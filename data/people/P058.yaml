other_info:
  other_info1:
    label: Изменение имени
    text: Его настоящее имя при рождении Лэвко Давыдович (по-украински). В царской России имя перевели на русский - отсюда Леонтий Давидович. [[doc:notes-svetlana-2004-2006|299589|299654]]
  other_info2:
    label: Раскулачивание
    text: Раскулачивания избежал при коллективизации только из-за большой семьи [[doc:notes-svetlana-2004-2006|5540|5611]]
  other_info3:
    label: Внуки
    text: У Лэвко(Леонтия) и Дарьи Шаравара было 17 внуков. Все они были знакомы друг с другом, проводили время все вместе, обедали за одним столом, помогали по хозяйству. [[doc:notes-svetlana-2004-2006|7592|8506]]
