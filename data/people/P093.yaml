- service_info: 1943. После освобождения оккупированной территории ушел на фронт
war_participation:
- war: 1941-1943. Во время оккупации Запорожской области находился с родителями на оккупированной территории; по воспоминаниям, оккупанты забирали продукты и теплые вещи у местного населения и вырубали сады у домов, опасаясь сопротивления. [[doc:notes-svetlana-2004-2006|20036|20407]]
residences:
- residence_info: Территория нынешних Запорожской и Днепропетровской областей
hobbies: Хорошо пел, аккомпанируя себе на гитаре. Играл в карты и рассказывал байки; подростками Светлана Павловна и ее двоюродные любили с ним встречаться.
character: Шутливый, общительный, оптимистичный.
appearance: Высокий, черноволосый, красивый.
health: На фронте потерял полступни, носил протез.
other_info:
- label: Крёстный
  text: Является крестным отцом Шароваровой Светланы Павловной, дочери родного брата.
- label: Смена фамилии
  text: Так же как и его брат Павел, сменил фамилию Шаравара на русский аналог Шароваров, когда пошел на фронт [[doc:notes-svetlana-2004-2006|20329|20407]]
