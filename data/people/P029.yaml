hobbies: Любила ходить в кино и развлекаться (прогулки в парках, кофе с пончиками и прочее)
character: 'По словам дочери Ольги Леонидовны: тяжёлый характер, умная, по-житейски амбициозная, прагматичная, властная, требовательная, могла выражать презрение и недовольство по отношению к детям'
appearance: Невысокая, полненькая, очень обаятельная. Любила каблуки, сумочки, пальто. До старости следила за собой — красила губы, красила и завивала волосы на бигуди. Очень красивый почерк.
health: Страдала приступами высокого давления. Перед смертью была частично парализована около месяца.
other_info:
- label: Заметка
  text: Отчество было изменено с Юлиановна на Юльевна, а национальность указана как русская, чтобы избежать проблем с замужеством за военным. Последние годы жила с сыном Виктором. С внучкой Евгенией Викторовной общалась спокойно, учила её бытовым навыкам.
sources:
- source: Семейные заметки, стр. 26-30 (записи Евгении Викторовны Шарифуллиной)
