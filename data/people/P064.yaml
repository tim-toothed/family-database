  other_info2:
    label: Смена даты рождения
    text: В официальных документах его датой рождения значилось 30 апреля, а не 7 января. При приеме в члены КПСС её сменили из соображения, что коммунист-атеист не может отмечать в Рождество даже свой день рождения. [[doc:notes-svetlana-2004-2006|19877|20035]]
