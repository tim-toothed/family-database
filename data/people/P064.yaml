education:
- education_info: Школьное образование - Семилетка
- education_info: Ветеринарный сельхозтехникум в пос. Новониколаевка; ушел на фронт с третьего курса
nationality: Украинец
jobs:
- job: Офицер-танкист
- job: ~В школьные годы, во время летних каникул, уничтожение грызунов, за шкурки которых государство платило деньги. [[doc:notes-svetlana-2004-2006|15831|16164]]
- job: ~В школьные годы, во время летних каникул, участвовал в сборе урожая овощей, фруктов и бахчевых
- job: ~1950. Курильские острова, о. Шумшу (самый северный в гряде)
- job: После военной службы. Долго работал на игрушечной фабрике - в фабричном комитете, в отделе кадров
- job: После работы на фабрике. Работал в Совете ветеранов города Житомира
- job: ~С начала 2000-х. Пенсионер, не работал
military_service:
- service_info: 5 августа 1941 года. Ушёл на фронт добровольцем с третьего курса ветеринарного сельхозтехникума
- service_info: 1941-1942. Разведчик.
- service_info: Офицер-танкист.
- service_info: 1946. Лейтенант-танкист.
- service_info: До 1973 года. Замполит отдельного батальона связи в г. Житомире.
- service_info: 1973. Ушел в отставку в звании подполковника.
war_participation:
- war: 1941-1942. Битва под Москвой; в декабре 1941 года был разведчиком и получил первое ранение
- war: 1944. Рижская операция; при освобождении Риги его танк Т-34 подорвался на мине
- war: 1945. Штурм Кёнигсберга; горел в танке, Победу встретил в госпитале в Кёнигсберге
- war: За годы войны был дважды ранен и дважды горел в танке
achievements:
- achievement: 1946. Участие в парадах на Красной площади со взводом своих танков 1 мая и 7 ноября
- achievement: Почетный гражданин Риги при СССР
- achievement: Т-34, на котором Павел участвовал в освобождении Риги, стоял на постаменте в пригороде Риги
- achievement: Два ордена Красного Знамени
- achievement: Два ордена Отечественной войны
- achievement: Множество медалей
residences:
- residence_info: Территория нынешних Запорожской и Днепропетровской областей
- residence_info: До войны жил с родителями в поселке при конезаводе
- residence_info: 1946. СССР, Белорусская ССР
- residence_info: СССР, Белорусская ССР (ДОС, дом офицерского состава)
- residence_info: Курильские острова (ДОС, дом офицерского состава)
- residence_info: СССР, Украинская ССР, г. Львов (ДОС, дом офицерского состава)
- residence_info: СССР, Украинская ССР, Житомирская область, г. Овруч (ДОС, дом офицерского состава)
- residence_info: 1957-1962. СССР, Украинская ССР, Житомирская область, Лучины (ДОС, дом офицерского состава; танковый полк)
- residence_info: 1962. СССР, Украинская ССР, г. Житомир (ДОС, дом офицерского состава)
hobbies: Любил работы в саду, сбор фруктов, грибов. Любил ухаживать за конями. Любил собак, даже не мог застрелить фашистских собак на войне [[doc:notes-svetlana-2004-2006|17881|18130]]. Любимые песни - «Дивлюсь я на небо», «Живет моя отрада», «Далеко-далеко, где кочуют туманы», «Эх, дороги».
character: Более эмоциональный, импульсивный в сравнении с женой.
appearance: 'Светловолосый '
health: В 80 лет получил первую группу инвалидности; почти ослеп в результате ранения в голову на войне.
other_info:
- label: Смена фамилии
  text: Изначальную "непонятную украинскую" фамилию Шаравара сменили на фронте на Шароваров [[doc:notes-svetlana-2004-2006|19800|19874]]
- label: Смена даты рождения
  text: В официальных документах его датой рождения значилось 30 апреля, а не 7 января. При приеме в члены КПСС её сменили из соображения, что коммунист-атеист не может отмечать в Рождество даже свой день рождения. [[doc:notes-svetlana-2004-2006|19877|20035]]
- label: Военные парады
  text: Рассказы Леонтия о подготовке к военным парадам на Красной площади. [[doc:notes-svetlana-2004-2006|13077|13413]]
- label: Знакомство с женой
  text: В мае 1946 года Павел вновь познакомился с Ниной Нечитайло, с которой раньше учился в одном классе, после чего между ними завязалась переписка и он сделал ей предложение в письме. [[doc:notes-svetlana-2004-2006|13413|13689]]
- label: Свадьба
  text: Во время отпуска Павла после парада 7 ноября 1946 года они с Ниной зарегистрировали брак в сельсовете в ее обеденный перерыв и скромно отметили свадьбу дома. [[doc:notes-svetlana-2004-2006|13690|14139]]
sources:
