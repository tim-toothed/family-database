other_info: "По семейным рассказам говорил, что «пришёл в Россию революцию делать». Предположительно дезертировал во время Первой мировой войны. Между 1914 и 1920 годами его местонахождение неизвестно. На фотографии 1928 года в посёлке Красный Текстильщик он изображён с Анной Харитоновной и детьми Александром, Зинаидой и младенцем Анатолием. Семья перемещалась по железной дороге на юго-восток страны; позднее в 1930 году в Махачкале родилась дочь Таисия. К 1949 году он и его жена были пенсионерами. Предположительно умер до 1955 года."

sources:
  - source: "Семейные заметки, стр. 38-39 (записи Евгении Викторовны Шарифуллиной)"