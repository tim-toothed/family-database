hobbies: Путешествия, рыбалка. Обожал долгие прогулки, туризм. Очень много вещей делал сам, рукастый. В одиночку выстроил дом на даче. Переделывал планировку типового проекта, ставил дом на высокие столбы фундамента, которые сам вручную отливал начиная с 79-80-х годов, только крышу крыть приглашал друзей. Играл на гитаре, очень много читал, обожал музыку. Снимал на фото и кинокамеру. Ценил искусство, хороший вкус. По словам Ольги Леонидовны, его жены, увлекался эзотерикой, йогой, буддизмом.
character: Добрый, но непоследовательный человек, непрактичный.
appearance: высокий, интеллигентная внешность (в среднем возрасте)
health: Страдал алкоголизмом. Лежал в психиатрической лечебнице в 1981 году. Лечился от алкоголизма. Потом не пил, примерно до 1989-1990 года, и не курил. С перестройкой и развалом Союза сорвался. И дальше только по накатанной. К 2000-му уже белая горячка, приступы агрессии по отношению к жене и младшей дочери. Умер от инсульта. В детстве болел всеми детскими болезнями. Слабое сердце, очень плохие зубы.
sources:
- source: Семейные заметки, стр. 18-20 (записи Евгении Викторовны Шарифуллиной)
