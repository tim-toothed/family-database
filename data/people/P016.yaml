education:
- education_info: 1947-1958. Школа №203 им. Грибоедова (ул. Кирочная, д.8). В 10 классе в феврале ушел из школы.
- education_info: С 12.02.1958 ученик монтажного цеха №5 __(?) Электро…(?)
- education_info: 1959. Закончил 10 класс в школе рабочей молодежи №81.
- education_info: '1976. ПТУ №20, вечернее отделение. Специальность: регулировщик радиоаппаратуры 6-го разряда.'
- education_info: '1980-1983. Одесский/Московский техникум измерений Госстандарта (вероятно, заочное отделение). Специальность: техник-метролог.'
- education_info: '1984-1986. Университет Марксизма и Ленинизма, идеологический факультет, кафедра этики и эстетики. Специальность: этика и эстетика.'
- education_info: '1986-1988. УМЛ. Специальность: научный атеизм.'
