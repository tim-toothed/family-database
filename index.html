<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Семейное древо</title>
    <link rel="stylesheet" href="./styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Семейное древо</h1>
        <p class="subtitle">made by P049 Шарифуллин Тимур Маратович</p>
      </div>
      <div class="toolbar">
        <select id="rootPersonSelect" class="editor-person-jump" aria-label="От кого строить дерево">
          <option value="">От кого строить дерево...</option>
        </select>
        <button id="buildTreeButton" type="button">Построить дерево</button>
        <a class="toolbar-link" href="./documents.html">Документы</a>
      </div>
    </header>

    <main class="layout">
      <section class="graph-panel">
        <div class="view-tabs" role="tablist" aria-label="Режим отображения">
          <button id="graphTabButton" class="view-tab is-active" type="button" role="tab" aria-selected="true">
            Визуализация
          </button>
          <button id="tableTabButton" class="view-tab" type="button" role="tab" aria-selected="false">
            Таблица
          </button>
        </div>

        <div class="view-shell">
          <div id="loadingState" class="state">Загрузка данных...</div>

          <div id="graphView" class="view-content">
            <details id="graphLayoutMenu" class="graph-layout-menu">
              <summary id="graphLayoutTrigger" class="graph-layout-trigger" aria-label="Тип визуализации">⋯</summary>
              <div id="graphLayoutList" class="graph-layout-list"></div>
            </details>
            <div id="graph"></div>
            <span id="modeHint" class="mode-hint"></span>
          </div>

          <div id="tableView" class="view-content hidden">
            <div id="peopleTable" class="people-table-wrap"></div>
          </div>
        </div>
      </section>

      <aside class="details-panel" id="detailsPanel">
        <div class="details-empty" id="detailsEmpty">
          Выберите человека на графе или в таблице.
        </div>
        <div class="details-content hidden" id="detailsContent">
          <div class="details-header">
            <div>
              <h2 id="personTitle"></h2>
              <div id="personSubtitle" class="person-subtitle"></div>
            </div>
            <button id="toggleEditButton" class="details-edit-button" type="button" aria-label="Редактировать карточку" aria-pressed="false" hidden>
              ✎
            </button>
          </div>
          <div id="personBody"></div>
        </div>
      </aside>
    </main>

    <template id="fieldTemplate">
      <section class="field-block">
        <h3 class="field-title"></h3>
        <div class="field-value"></div>
      </section>
    </template>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
