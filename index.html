<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Семейное древо</title>
    <link rel="stylesheet" href="./styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/vis-network@9.1.9/styles/vis-network.min.css"
    />
    <style>
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .toolbar input,
      .toolbar button {
        min-height: 38px;
      }

      .toolbar input {
        min-width: 220px;
      }

      .graph-panel {
        position: relative;
      }

      #graph {
        min-height: 72vh;
      }

      .mode-hint {
        font-size: 0.9rem;
        opacity: 0.8;
        white-space: nowrap;
      }

      .inspect-button {
        position: absolute;
        z-index: 5;
        width: 26px;
        height: 26px;
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.18);
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Семейное древо</h1>
        <p class="subtitle">Статический сайт для GitHub Pages, потому что серверы любят усложнять жизнь.</p>
      </div>
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Поиск по имени или ID" />
        <input id="rootPersonInput" type="search" list="rootPersonOptions" placeholder="От кого строить дерево" />
        <datalist id="rootPersonOptions"></datalist>
        <button id="buildTreeButton" type="button">Построить дерево</button>
        <button id="fitButton" type="button">Показать всё</button>
        <span id="modeHint" class="mode-hint"></span>
      </div>
    </header>

    <main class="layout">
      <section class="graph-panel">
        <div id="loadingState" class="state">Загрузка данных...</div>
        <div id="graph"></div>
        <button id="inspectButton" class="inspect-button" type="button" hidden>⌕</button>
      </section>

      <aside class="details-panel" id="detailsPanel">
        <div class="details-empty" id="detailsEmpty">
          Выберите человека на графе. Люди всё-таки зачем-то оставляют после себя данные.
        </div>
        <div class="details-content hidden" id="detailsContent">
          <div class="details-header">
            <div>
              <h2 id="personTitle"></h2>
              <div id="personSubtitle" class="person-subtitle"></div>
            </div>
          </div>
          <div id="personBody"></div>
        </div>
      </aside>
    </main>

    <template id="fieldTemplate">
      <section class="field-block">
        <h3 class="field-title"></h3>
        <div class="field-value"></div>
      </section>
    </template>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
