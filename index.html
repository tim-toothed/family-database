<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Семейное древо</title>
    <link rel="stylesheet" href="./styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  </head>
  <body>
    <header class="topbar main-topbar">
      <button
        id="appMenuButton"
        class="app-menu-button"
        type="button"
        aria-label="Открыть меню"
        aria-controls="appSideMenu"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="topbar-title">
        <h1>Семейное древо</h1>
      </div>
      <div class="topbar-search">
        <input
          id="personSearchInput"
          class="topbar-search-input"
          type="search"
          autocomplete="off"
          placeholder="Поиск карточки..."
          aria-label="Поиск карточки"
          aria-expanded="false"
          aria-controls="personSearchSuggestions"
        />
        <div id="personSearchSuggestions" class="person-search-suggestions" role="listbox" hidden></div>
      </div>
    </header>

    <main class="layout">
      <section class="graph-panel">
        <div class="view-tabs" role="tablist" aria-label="Режим отображения">
          <button id="graphTabButton" class="view-tab is-active" type="button" role="tab" aria-selected="true">
            Визуализация
          </button>
          <button id="tableTabButton" class="view-tab" type="button" role="tab" aria-selected="false">
            Таблица
          </button>
        </div>

        <div class="view-shell">
          <div id="loadingState" class="state">Загрузка данных...</div>

          <div id="graphView" class="view-content">
            <details id="graphLayoutMenu" class="graph-layout-menu">
              <summary id="graphLayoutTrigger" class="graph-layout-trigger" aria-label="Тип визуализации">⋯</summary>
              <div id="graphLayoutList" class="graph-layout-list"></div>
            </details>
            <div id="graph"></div>
            <button id="modeHint" class="mode-hint" type="button" aria-haspopup="dialog"></button>
          </div>

          <div id="tableView" class="view-content hidden">
            <div id="peopleTable" class="people-table-wrap"></div>
          </div>
        </div>
      </section>

      <aside class="details-panel" id="detailsPanel">
        <div class="details-empty" id="detailsEmpty">
          Выберите человека на графе или в таблице.
        </div>
        <div class="details-content hidden" id="detailsContent">
          <div class="details-header">
            <div>
              <h2 id="personTitle"></h2>
              <div id="personSubtitle" class="person-subtitle"></div>
            </div>
          </div>
          <div id="personBody"></div>
        </div>
      </aside>
    </main>

    <template id="fieldTemplate">
      <section class="field-block">
        <h3 class="field-title"></h3>
        <div class="field-value"></div>
      </section>
    </template>

    <dialog id="rootPersonDialog" class="root-person-dialog">
      <form method="dialog" class="root-person-form">
        <h2>От кого строить дерево</h2>
        <label class="side-menu-field">
          <span>Человек</span>
          <input
            id="rootPersonInput"
            class="editor-person-jump"
            type="text"
            list="mainPersonOptions"
            autocomplete="off"
            placeholder="Имя или ID..."
            aria-label="От кого строить дерево"
          />
        </label>
        <div id="rootPersonMessage" class="root-person-message" aria-live="polite"></div>
        <div class="root-person-actions">
          <button value="cancel" class="toolbar-button toolbar-button-subtle" type="submit">Отмена</button>
          <button id="rootPersonApplyButton" class="save-yaml-button" type="button">Построить</button>
        </div>
      </form>
    </dialog>
    <dialog id="newRelationPersonDialog" class="root-person-dialog">
      <form method="dialog" class="root-person-form">
        <h2>Новая карточка</h2>
        <label class="side-menu-field">
          <span>ФИО</span>
          <input
            id="newRelationPersonNameInput"
            class="editor-person-jump"
            type="text"
            autocomplete="off"
            placeholder="Фамилия Имя Отчество"
            aria-label="ФИО новой карточки"
          />
        </label>
        <div id="newRelationPersonMessage" class="root-person-message" aria-live="polite"></div>
        <div class="root-person-actions">
          <button value="cancel" class="toolbar-button toolbar-button-subtle" type="submit">Отмена</button>
          <button id="newRelationPersonCreateButton" class="save-yaml-button" type="button">Добавить в связь</button>
        </div>
      </form>
    </dialog>
    <datalist id="mainPersonOptions"></datalist>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
