# Индекс людей в базе данных
# --- Правила про ID ---
## Все ID должны быть строго уникальными, не должны повторяться
## Числа (Pxxx) даются произвольно, в порядке появления информации о человеке в документе. 
## Порядок ID с точки зрения чтения документа может быть любым (после `P001` может идти `P055`, если этот родственник был пропущен ранее)

# --- Правила про ФИО ---
## Имена даются в формате "Фамилия Имя Отчество".
## Указываются имена при рождении человека*.
## *Если девичья фамилия неизвестна ("???"), то в скобках указывается фамилия, полученная при замужестве** 
## ** Если также неизвестно, менялась ли фамилия при замужестве, то в скобках указывается фамилия со знаком "?" (например, Комарова (Смирнова?) Настасья Никифоровна)
## Если имя, фамилия или отчество неизвестно, то ставится "???" для каждого неизвестного элемента, в скобках указывается дополнительная информация.
## Если ФИО неизвестно полностью, то в скобках указывается дополнительная информация о человеке (??? ??? ??? (первая жена Ивана Васильевича Гречнева)).
## Если ФИО полностью идетично для двух разных людей, то в скобках указывается дополнительная информация (например, "Петров Иван Петрович (старший)" и "Петров Иван Петрович (младший)")
## Если элемент ФИО неточен, то после элемента ставится "?", опционально в скобках указываются дополнительная информация "...Лариса? (Клавдия?) Петровна"

